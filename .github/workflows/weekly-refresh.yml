# Every Monday: pull Ramu's new official releases into the site, and list new YouTube
# videos by others for review. Free: runs on GitHub Actions, no API keys or AI.
name: Weekly refresh

on:
  schedule:
    - cron: "30 1 * * 1"   # Monday 07:00 India time
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new releases (Deezer, Apple Music, JioSaavn)
        run: python3 tools/fetch_catalogue.py data

      - name: Rebuild discography
        run: |
          python3 tools/merge.py data
          python3 tools/build_music.py data docs/music/index.html

      - name: Add new YouTube releases and rebuild Listen
        run: |
          python3 tools/refresh_youtube.py data
          python3 tools/build_listen.py data docs/listen/index.html
          python3 tools/build_home_latest.py data docs/index.html

      - name: Find new videos by others
        run: python3 tools/discover_videos.py data > candidates.json

      - name: Publish changes
        run: |
          git diff --name-only | python3 tools/touch_sitemap.py docs/sitemap.xml
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "Site updater"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs data
            git commit -m "Weekly refresh: new releases $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes this week."
          fi

      - name: Open a review issue for new videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, subprocess
          c = json.load(open('candidates.json'))
          if not c:
              print('No new videos to review.'); raise SystemExit
          lines = ['New YouTube videos that mention Ramu were found this week. They are **not** on the site yet.', '',
                   'To publish some, comment with their numbers, for example `add 1 3`. To publish all, comment `add all`.',
                   'To ignore them, just close this issue.', '']
          for i, v in enumerate(c, 1):
              meta = ' · '.join(x for x in [v.get('channel'), v.get('published'), v.get('length')] if x)
              lines.append(f"{i}. [{v['title']}](https://www.youtube.com/watch?v={v['id']}) — {meta}")
          lines += ['', '<!-- candidates:' + json.dumps(c, ensure_ascii=False) + ' -->']
          subprocess.run(['gh', 'label', 'create', 'video-review', '--color', 'D2A95E', '--force'], check=False)
          subprocess.run(['gh', 'issue', 'create', '--title', f'New videos to review ({len(c)})',
                          '--label', 'video-review', '--body', '\n'.join(lines)], check=True)
          EOF
