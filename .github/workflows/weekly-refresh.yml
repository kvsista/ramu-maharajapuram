# Every Monday: pull Ramu's new official releases into the site, and list new YouTube
# videos by others for review. Free: runs on GitHub Actions, no API keys or AI.
name: Weekly refresh

on:
  schedule:
    - cron: "30 1 * * 1"   # Monday 07:00 India time
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new releases (Deezer, Apple Music, JioSaavn)
        run: python3 tools/fetch_catalogue.py data

      - name: Rebuild discography
        run: |
          python3 tools/merge.py data
          python3 tools/build_music.py data docs/music/index.html

      - name: Add new YouTube releases and rebuild Listen
        run: |
          python3 tools/refresh_youtube.py data
          python3 tools/build_listen.py data docs/listen/index.html
          python3 tools/build_home_latest.py data docs/index.html

      - name: Find new videos of Ramu and his new posts
        run: |
          python3 tools/discover_videos.py data > candidates.json
          python3 tools/discover_posts.py data > posts.json
          # Gopal Sapthaswaram videos (credits in their descriptions) were added to Listen directly
          python3 tools/build_listen.py data docs/listen/index.html

      - name: Suggest headlines and song names (Gemini free tier)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/suggest_titles.py posts.json candidates.json || true

      - name: Write news into the pages and refresh the album counts
        run: |
          python3 tools/build_news.py docs
          python3 tools/update_counts.py data docs

      - name: Version stylesheets and scripts
        run: python3 tools/stamp_assets.py docs

      - name: Publish changes
        run: |
          git diff --name-only | python3 tools/touch_sitemap.py docs/sitemap.xml
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "Site updater"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs data
            git commit -m "Weekly refresh: new releases $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes this week."
          fi

      - name: Open the weekly review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, subprocess
          c, p = json.load(open('candidates.json')), json.load(open('posts.json'))
          if not c and not p:
              print('Nothing new to review.'); raise SystemExit
          L = ['New things found this week. Nothing here is on the site until you reply.', '',
               'Reply with one instruction per line, for example:', '',
               '```', 'listen 1 3', 'add 2', 'news P1', 'story P2: Canada Day concert, Mississauga', '```', '',
               '- `listen N` adds a video to **Listen → Songs of SPB** (he sings an SPB song). `listen N: Song name` also names the song',
               '- `stage N` adds it to **Listen → More on stage & TV** (any other song)',
               '- `add N` puts it on the **Watch** page (`add all` for every video)',
               '- `news PN` shows a post in the **homepage news** (optionally `news PN: Your headline`)',
               '- `story PN: Title` adds a post to the top of the **Story** timeline', '',
               'Where a **suggested** headline or song name is shown, `story PN`, `news PN` or `listen N` on its own uses it.', '',
               'You can reply more than once. Close the issue when you are done.', '']
          if c:
              L.append(f'### Videos ({len(c)})')
              for i, v in enumerate(c, 1):
                  meta = ' · '.join(x for x in [v.get('channel'), v.get('published'), v.get('length')] if x)
                  tags = (' ✓ his usual channel' if v.get('trusted') else '') + (' · plays on YouTube only' if v.get('blocked') else '')
                  L.append(f"{i}. [{v['title']}](https://www.youtube.com/watch?v={v['id']}) — {meta}{tags}"
                           + (f"<br>Song: **{v['suggested']}**" if v.get('suggested') else ''))
              L.append('')
          if p:
              L.append(f'### His posts ({len(p)})')
              for i, x in enumerate(p, 1):
                  t = ' '.join(x['text'].split())[:120] or '(no caption)'
                  where = 'Instagram' if x['src'] == 'instagram' else 'Facebook'
                  L.append(f"P{i}. [{t}]({x['link']}) — {where} · {x['time'][:10]}{' · video' if x.get('video') else ''}"
                           + (f"<br>Suggested headline: **{x['suggested']}**" if x.get('suggested') else ''))
              L.append('')
          L += ['<!-- candidates:' + json.dumps(c, ensure_ascii=False) + ' -->', '<!-- posts:' + json.dumps(p, ensure_ascii=False) + ' -->']
          subprocess.run(['gh', 'label', 'create', 'video-review', '--color', 'D2A95E', '--force'], check=False)
          subprocess.run(['gh', 'issue', 'create', '--title', f'Weekly review: {len(c)} videos, {len(p)} posts',
                          '--label', 'video-review', '--body', '\n'.join(L)], check=True)
          EOF
