name: Models test (temporary)
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ github.token }}
        run: |
          B='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi in 3 words"}]}'
          echo "== A"; curl -s -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$B" | head -c 300; echo
          echo "== B"; curl -s -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$B" -w " [%{http_code}]" | head -c 300; echo
          echo "== C"; curl -s -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi in 3 words"}]}' -w " [%{http_code}]" | head -c 300; echo
          echo "== D"; curl -s https://models.github.ai/catalog/models -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" | head -c 300; echo
