name: Models test (temporary)
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;d=json.load(open('data/social.json'));json.dump(d['items'][:8],open('p.json','w'))"
          echo '[{"id":"a","title":"Enoch Rhythms Band | Singer Ramu Feb26 | kathalin Theepam song #livemusic","channel":"enoch eno"},{"id":"b","title":"Ramu Perform | Adibhikshuvu Song | Shambo Shiva Shambo | Maha Shivaratri Event 2020","channel":"etvteluguindia"},{"id":"c","title":"Kalakaalam Ide Paadanee by Ramu and Sarada in Bay Area SP Balu BDay Concert (06/02/2012)","channel":"chimatamusic1"}]' > v.json
          python3 tools/suggest_titles.py p.json v.json
          python3 -c "
          import json
          for x in json.load(open('p.json')): print('POST |', ' '.join(x['text'].split())[:70], '=>', x.get('suggested'))
          for x in json.load(open('v.json')): print('VIDEO |', x['title'][:60], '=>', x.get('suggested'))
          "
