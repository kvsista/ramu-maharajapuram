# When the site owner comments "add 1 3" (or "add all") on a "New videos to review" issue,
# publish those videos to the Watch page and close the issue.
name: Approve videos

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      contains(github.event.issue.labels.*.name, 'video-review') &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'add')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish approved videos
        env:
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          added="$(python3 tools/approve_videos.py data)"
          python3 tools/build_watch_latest.py data docs/watch/index.html
          git diff --name-only | python3 tools/touch_sitemap.py docs/sitemap.xml
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "Site updater"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs data
            git commit -m "Add approved videos (issue #$ISSUE)"
            git push
          fi
          gh issue comment "$ISSUE" --body "Published on the Watch page (live in about a minute):
          $added"
          gh issue close "$ISSUE"
